# Math-heavy eval: code-only baseline
# Tests code-only retrieval on math/scientific queries

name: math_heavy_code_only_unixcoder
repo_path: /Users/whitney/src/code_rag
repo: code_rag
branch: main

vector_store:
  backend: qdrant
  collection: code_chunks
  url: http://localhost:6333
  collection_strategy: per_experiment
  create_payload_indexes: true
  enable_sparse_vectors: false
  enable_named_vectors: true
  default_dense_vector_name: code

embedding:
  backend: unixcoder
  model: microsoft/unixcoder-base
  representation_type: code

chunking:
  strategy: ast
  chunk_size: 100
  overlap: 15

retrieval:
  mode: dense
  top_k: 5
  rerank: false
  vector_name: code

eval:
  retrieval_eval_set: evals/code_rag_math_heavy.json
  max_iterations: 2
