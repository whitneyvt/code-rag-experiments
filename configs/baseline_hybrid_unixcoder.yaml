# Baseline hybrid search with UniXcoder embeddings
# Uses Python BM25 + dense retrieval with RRF fusion

name: baseline_hybrid_unixcoder
repo_path: /Users/whitney/src/code_rag
repo: code_rag
branch: main

vector_store:
  backend: qdrant
  collection: code_chunks
  url: http://localhost:6333
  collection_strategy: per_experiment
  create_payload_indexes: true
  enable_sparse_vectors: false

embedding:
  backend: unixcoder
  model: microsoft/unixcoder-base

chunking:
  strategy: ast
  chunk_size: 100
  overlap: 15

retrieval:
  mode: hybrid
  top_k: 5
  rerank: false
  native_hybrid: false

eval:
  retrieval_eval_set: evals/code_rag.json
  planning_eval_set: evals/planning_code_rag.json
  max_iterations: 2
