# Comments-only representation experiment
# Embeds only docstrings and comments (tests documentation retrieval)

name: qdrant_named_comments_only_unixcoder
repo_path: /Users/whitney/src/code_rag
repo: code_rag
branch: main

vector_store:
  backend: qdrant
  collection: code_chunks
  url: http://localhost:6333
  collection_strategy: per_experiment
  create_payload_indexes: true
  enable_sparse_vectors: false
  enable_named_vectors: true
  default_dense_vector_name: comments

embedding:
  backend: unixcoder
  model: microsoft/unixcoder-base
  representation_type: comments

chunking:
  strategy: ast
  chunk_size: 100
  overlap: 15

retrieval:
  mode: dense
  top_k: 5
  rerank: false
  vector_name: comments

eval:
  retrieval_eval_set: evals/code_rag.json
  planning_eval_set: evals/planning_code_rag.json
  max_iterations: 2
