# Adaptive routing: general eval set
# Tests query-adaptive routing on the general code_rag eval set
# Routes queries to best strategy based on query classification

name: adaptive_general_unixcoder
repo_path: /Users/whitney/src/code_rag
repo: code_rag
branch: main

vector_store:
  backend: qdrant
  collection: code_chunks
  url: http://localhost:6333
  collection_strategy: per_experiment
  create_payload_indexes: true
  enable_sparse_vectors: true
  enable_named_vectors: true
  default_dense_vector_name: dense

embedding:
  backend: unixcoder
  model: microsoft/unixcoder-base
  representation_type: code

chunking:
  strategy: ast
  chunk_size: 100
  overlap: 15

retrieval:
  mode: hybrid
  top_k: 5
  rerank: false
  native_hybrid: true
  prefetch_limit: 20
  adaptive: true

eval:
  retrieval_eval_set: evals/code_rag.json
  max_iterations: 2
